---
layout: default
---
<section class="post-hero">
  <div class="container">
    <a class="back-link" href="{{ '/blog.html' | relative_url }}">← Back to the blog</a>
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
    <h1>{{ page.title }}</h1>
  </div>
</section>

<article class="post-body">
  <div class="container">
    {{ content }}
  </div>
</article>
