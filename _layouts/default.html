<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="theme-color" content="#183B2A" />
  <title>{% if page.title %}{{ page.title }} | Penn Mushrooms{% else %}{{ site.title }} | Pennsylvania's Mushroom Country{% endif %}</title>

  <!-- Google Fonts: remove these two lines if you want a completely self-contained site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
